! ==============================================================================
! THIET BI: HANOI-DIST-SW01 (Distribution Switch 01 - Ha Noi R&D Campus)
! NHIEM VU: LACP noi SW02, HSRP Active VLAN 20, DHCP Relay tro ve HQ, Port Security
! ==============================================================================

enable
configure terminal

! 1. KHOI TAO CO BAN
hostname HANOI-DIST-SW01
ip routing

! 2. DANH SACH VLAN
vlan 20
 name RND_ENGINEERING
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
exit

! 3. LACP ETHERCHANNEL (Port-channel 1) NOI SANG HANOI-DIST-SW02
interface range Fa0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
exit

interface Port-channel 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20,99
 ip dhcp snooping trust
 no shutdown
exit

! 4. DUONG TRUNK Gig0/1 (DANH SAN DE NOI LEN HANOI EDGE ROUTER)
interface Gig0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20,99
 ip dhcp snooping trust
 no shutdown
exit

! 5. CONG Fa0/10 CAM PC R&D + PORT SECURITY + PORTFAST
interface Fa0/10
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! 6. SPANNING TREE: PRIMARY ROOT TAI HA NOI
spanning-tree mode rapid-pvst
spanning-tree vlan 20,99 root primary

! 7. SVI, HSRP ACTIVE & DHCP RELAY TRO VE HQ
interface Vlan 20
 ip address 10.32.20.2 255.255.255.0
 ip helper-address 10.16.99.1
 standby version 2
 standby 20 ip 10.32.20.1
 standby 20 priority 110
 standby 20 preempt
 no shutdown
exit

interface Vlan 99
 ip address 10.32.99.2 255.255.255.0
 no shutdown
exit

! 8. BAO MAT LAYER 2: DHCP SNOOPING
ip dhcp snooping
ip dhcp snooping vlan 20,99
no ip dhcp snooping information option

! 9. BAO MAT LAYER 2: GOM CONG THUA VAO BLACKHOLE VA TAT DI
interface range Fa0/3 - 9, Fa0/11 - 24, Gig0/2
 switchport mode access
 switchport access vlan 999
 shutdown
exit

end
write memory
