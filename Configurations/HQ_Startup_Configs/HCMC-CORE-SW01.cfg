! ==============================================================================
! THIET BI: HCMC-CORE-SW01 (Switch Layer 3 - Core Switch tai Hoi so chinh HCMC)
! NHIEM VU: Dinh tuyen L3, Root Spanning Tree, DHCP Server trung tam, DHCP Snooping
! ==============================================================================

enable
configure terminal

! 1. KHOI TAO CO BAN
hostname HCMC-CORE-SW01
ip routing

! 2. DANH SACH VLAN CHUAN TVI
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
exit

! 3. DUONG TRUNK NOI XUONG 2 CON DIST TAI HQ
interface range Gig0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 ip dhcp snooping trust
 no shutdown
exit

! 4. SPANNING TREE: EP CORE LAM ROOT PRIMARY CHO TOAN BO VLAN
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,99 root primary

! 5. SVI MANAGEMENT & DINH TUYEN TINH TRO VE 2 DIST TAI HQ
interface Vlan 99
 ip address 10.16.99.1 255.255.255.0
 no shutdown
exit

ip route 10.16.10.0 255.255.255.0 10.16.99.2
ip route 10.16.20.0 255.255.255.0 10.16.99.3

! 6. DICH VU DHCP SERVER TRUNG TAM CAP IP CHO CA 3 SITE (HQ, HA NOI, DA NANG)
! Exclude dia chi Gateway va IP tinh
ip dhcp excluded-address 10.16.10.1 10.16.10.10
ip dhcp excluded-address 10.16.20.1 10.16.20.10
ip dhcp excluded-address 10.32.20.1 10.32.20.10
ip dhcp excluded-address 10.48.30.1 10.48.30.10

! Pool cho HQ VLAN 10 (Tai chinh / Van phong)
ip dhcp pool POOL_VLAN10_HQ
 network 10.16.10.0 255.255.255.0
 default-router 10.16.10.1
 dns-server 10.16.99.1 8.8.8.8
exit

! Pool cho HQ VLAN 20 (Ky thuat HQ)
ip dhcp pool POOL_VLAN20_HQ
 network 10.16.20.0 255.255.255.0
 default-router 10.16.20.1
 dns-server 10.16.99.1 8.8.8.8
exit

! Pool cho Ha Noi VLAN 20 (R&D Campus Ha Noi)
ip dhcp pool POOL_VLAN20_HANOI
 network 10.32.20.0 255.255.255.0
 default-router 10.32.20.1
 dns-server 10.16.99.1 8.8.8.8
exit

! Pool cho Da Nang VLAN 30 (Logistics & IoT Da Nang)
ip dhcp pool POOL_VLAN30_DANANG
 network 10.48.30.0 255.255.255.0
 default-router 10.48.30.1
 dns-server 10.16.99.1 8.8.8.8
exit

! 7. BAO MAT LAYER 2: DHCP SNOOPING
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,99
no ip dhcp snooping information option

! 8. BAO MAT LAYER 2: GOM TOAN BO CONG THUA VAO BLACKHOLE VA TAT DI
interface range Fa0/1 - 24
 switchport mode access
 switchport access vlan 999
 shutdown
exit

end
write memory
