! ==============================================================================
! THIET BI: HCMC-DIST-SW02 (Distribution Switch 02 - Phia ben phai)
! NHIEM VU: LACP noi DIST-01, Trunk len Core, HSRP Active VLAN 20, DHCP Relay, Port Security
! ==============================================================================

enable
configure terminal

! 1. KHOI TAO CO BAN
hostname HCMC-DIST-SW02
ip routing

! 2. DANH SACH VLAN CHUAN TVI
vlan 10
 name EXEC_FINANCE
vlan 20
 name RND_ENGINEERING
vlan 30
 name LOGISTICS_OPS
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
exit

! 3. LACP ETHERCHANNEL (Port-channel 1) NOI SANG DIST-01
interface range Fa0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
exit

interface Port-channel 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 ip dhcp snooping trust
 no shutdown
exit

! 4. DUONG TRUNK Gig0/2 NOI LEN CORE
interface Gig0/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
 ip dhcp snooping trust
 no shutdown
exit

! 5. CONG Fa0/10 CAM PC1 (VLAN 20) + PORT SECURITY + PORTFAST
interface Fa0/10
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! 6. SPANNING TREE: RAPID-PVST (PRIORITY MAC DINH)
spanning-tree mode rapid-pvst

! 7. SVI, HSRP & DHCP RELAY (Active VLAN 20, Standby VLAN 10)
interface Vlan 10
 ip address 10.16.10.3 255.255.255.0
 ip helper-address 10.16.99.1
 standby version 2
 standby 10 ip 10.16.10.1
 standby 10 priority 100
 no shutdown
exit

interface Vlan 20
 ip address 10.16.20.3 255.255.255.0
 ip helper-address 10.16.99.1
 standby version 2
 standby 20 ip 10.16.20.1
 standby 20 priority 110
 standby 20 preempt
 no shutdown
exit

interface Vlan 99
 ip address 10.16.99.3 255.255.255.0
 no shutdown
exit

ip route 0.0.0.0 0.0.0.0 10.16.99.1

! 8. BẢO MẬT LAYER 2: DHCP SNOOPING
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,99
no ip dhcp snooping information option

! 9. BẢO MẬT LAYER 2: GOM TOAN BO CONG THUA VAO BLACKHOLE VA TAT DI
interface range Fa0/3 - 9, Fa0/11 - 24, Gig0/1
 switchport mode access
 switchport access vlan 999
 shutdown
exit

end
write memory
