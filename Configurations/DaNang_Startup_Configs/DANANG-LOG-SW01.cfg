! ==============================================================================
! THIET BI: DANANG-LOG-SW01 (Switch Chi nhanh Da Nang - Logistics & Distribution Hub)
! NHIEM VU: Switch Access/Dist cho IoT & Kho van, SVI Gateway VLAN 30, DHCP Relay tro HQ
! ==============================================================================

enable
configure terminal

! 1. KHOI TAO CO BAN
hostname DANANG-LOG-SW01
ip routing

! 2. DANH SACH VLAN
vlan 30
 name LOGISTICS_OPS
vlan 99
 name MANAGEMENT
vlan 999
 name BLACKHOLE
exit

! 3. DUONG TRUNK Gig0/1 (DANH SAN DE NOI LEN DANANG EDGE ROUTER)
interface Gig0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 30,99
 ip dhcp snooping trust
 no shutdown
exit

! 4. CONG Fa0/10 CAM THIET BI IOT / MAY QUET KHO + PORT SECURITY + PORTFAST
interface Fa0/10
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
exit

! 5. SPANNING TREE: ROOT PRIMARY TAI DA NANG
spanning-tree mode rapid-pvst
spanning-tree vlan 30,99 root primary

! 6. SVI GATEWAY CHO LOGISTICS & DHCP RELAY TRO VE HQ (10.16.99.1)
interface Vlan 30
 ip address 10.48.30.1 255.255.255.0
 ip helper-address 10.16.99.1
 no shutdown
exit

interface Vlan 99
 ip address 10.48.99.1 255.255.255.0
 no shutdown
exit

! 7. BAO MAT LAYER 2: DHCP SNOOPING
ip dhcp snooping
ip dhcp snooping vlan 30,99
no ip dhcp snooping information option

! 8. BAO MAT LAYER 2: GOM CONG THUA VAO BLACKHOLE VA TAT DI
interface range Fa0/1 - 9, Fa0/11 - 24, Gig0/2
 switchport mode access
 switchport access vlan 999
 shutdown
exit

end
write memory
