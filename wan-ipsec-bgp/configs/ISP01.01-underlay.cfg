! Step 6 delta only. Review backup/platform before applying; no automatic save.
configure terminal
ip routing
interface Loopback0
 ip address 10.254.0.21 255.255.255.255
exit
interface GigabitEthernet0/1
 ip address 10.255.2.1 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/0
 ip address 10.255.1.1 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 ip address 10.255.3.1 255.255.255.252
 no shutdown
exit
ip prefix-list S6-DENY4 seq 10 deny 0.0.0.0/0 le 32
ip prefix-list S6-TRANSPORT4 seq 10 permit 10.255.2.0/30
ip prefix-list S6-TRANSPORT4 seq 20 permit 10.255.1.0/30
ip prefix-list S6-TRANSPORT4 seq 30 permit 10.255.3.0/30
router bgp 65000
 bgp router-id 10.254.0.21
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.2.2 remote-as 65001
 neighbor 10.255.1.2 remote-as 65002
 neighbor 10.255.3.2 remote-as 65003
 address-family ipv4 unicast
  neighbor 10.255.2.2 activate
  neighbor 10.255.2.2 prefix-list S6-DENY4 in
  neighbor 10.255.2.2 prefix-list S6-TRANSPORT4 out
  network 10.255.2.0 mask 255.255.255.252
  neighbor 10.255.1.2 activate
  neighbor 10.255.1.2 prefix-list S6-DENY4 in
  neighbor 10.255.1.2 prefix-list S6-TRANSPORT4 out
  network 10.255.1.0 mask 255.255.255.252
  neighbor 10.255.3.2 activate
  neighbor 10.255.3.2 prefix-list S6-DENY4 in
  neighbor 10.255.3.2 prefix-list S6-TRANSPORT4 out
  network 10.255.3.0 mask 255.255.255.252
 exit-address-family
exit
end
