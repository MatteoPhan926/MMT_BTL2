! Step 6 delta only. Review backup/platform before applying; no automatic save.
configure terminal
ip prefix-list S6-DN-IN4 seq 10 permit 10.10.100.0/24
ip prefix-list S6-DN-OUT4 seq 10 permit 10.30.16.0/20
router bgp 65003
 neighbor 172.16.2.1 remote-as 65001
 address-family ipv4 unicast
  network 10.30.16.0 mask 255.255.240.0
  neighbor 172.16.2.1 activate
  neighbor 172.16.2.1 prefix-list S6-DN-IN4 in
  neighbor 172.16.2.1 prefix-list S6-DN-OUT4 out
 exit-address-family
exit
end
