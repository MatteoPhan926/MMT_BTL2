! Step 6 delta only. Review backup/platform before applying; no automatic save.
configure terminal
ip routing
interface GigabitEthernet0/0
 ip address 10.255.1.2 255.255.255.252
 no shutdown
exit
ip prefix-list S6-DENY4 seq 10 deny 0.0.0.0/0 le 32
ip prefix-list S6-ISP-IN4 seq 10 permit 10.255.2.0/30
ip prefix-list S6-ISP-IN4 seq 20 permit 10.255.3.0/30
router bgp 65002
 bgp router-id 10.254.0.15
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.1.1 remote-as 65000
 address-family ipv4 unicast
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 prefix-list S6-ISP-IN4 in
  neighbor 10.255.1.1 prefix-list S6-DENY4 out
 exit-address-family
exit
end
