! Step 6 delta only. Review backup/platform before applying; no automatic save.
configure terminal
ip prefix-list S6-HN-IN4 seq 10 permit 10.20.16.0/20
ip prefix-list S6-HN-OUT4 seq 10 permit 10.10.100.0/24
ip prefix-list S6-DN-IN4 seq 10 permit 10.30.16.0/20
ip prefix-list S6-DN-OUT4 seq 10 permit 10.10.100.0/24
router bgp 65001
 neighbor 172.16.1.2 remote-as 65002
 neighbor 172.16.2.2 remote-as 65003
 address-family ipv4 unicast
  network 10.10.100.0 mask 255.255.255.0
  neighbor 172.16.1.2 activate
  neighbor 172.16.1.2 prefix-list S6-HN-IN4 in
  neighbor 172.16.1.2 prefix-list S6-HN-OUT4 out
  neighbor 172.16.2.2 activate
  neighbor 172.16.2.2 prefix-list S6-DN-IN4 in
  neighbor 172.16.2.2 prefix-list S6-DN-OUT4 out
 exit-address-family
exit
end
