! Step 6 delta only. Review backup/platform before applying; no automatic save.
configure terminal
! Optional upgrade only after IPv4 passes and dual-overlay support is proved.
ipv6 unicast-routing
interface Tunnel0
 shutdown
 no tunnel protection ipsec profile S6-HN-IPSEC
 tunnel mode ipsec dual-overlay
 ipv6 address 2001:db8:ff00:1::1/64
 ipv6 mtu 1400
 ipv6 tcp adjust-mss 1340
 tunnel protection ipsec profile S6-HN-IPSEC
 no shutdown
exit
interface Tunnel1
 shutdown
 no tunnel protection ipsec profile S6-DN-IPSEC
 tunnel mode ipsec dual-overlay
 ipv6 address 2001:db8:ff00:2::1/64
 ipv6 mtu 1400
 ipv6 tcp adjust-mss 1340
 tunnel protection ipsec profile S6-DN-IPSEC
 no shutdown
exit
end
