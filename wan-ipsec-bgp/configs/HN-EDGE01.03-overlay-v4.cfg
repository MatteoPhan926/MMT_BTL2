! Step 6 delta only. Review backup/platform before applying; no automatic save.
configure terminal
ip prefix-list S6-HN-IN4 seq 10 permit 10.10.100.0/24
ip prefix-list S6-HN-OUT4 seq 10 permit 10.20.16.0/20
router bgp 65002
 neighbor 172.16.1.1 remote-as 65001
 address-family ipv4 unicast
  network 10.20.16.0 mask 255.255.240.0
  neighbor 172.16.1.1 activate
  neighbor 172.16.1.1 prefix-list S6-HN-IN4 in
  neighbor 172.16.1.1 prefix-list S6-HN-OUT4 out
 exit-address-family
exit
end
