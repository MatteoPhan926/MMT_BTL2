! ============================================================
! ROLE 3 - WAN & SECURITY - PACKET TRACER LAB
! Device: HQ-TEST-LAN (Layer-3 test switch)
! Purpose: Corporate/Guest VLAN, Guest isolation, HQ uplink
! Source: HQ-TEST-LAN running-config supplied by project member
! Note: VLAN 10 and VLAN 50 are declared explicitly so that
!       this text can be used as a reusable lab configuration.
!       VLAN definitions are not shown in the supplied running-config.
! Do not apply to the group's official campus switches unchanged.
! ============================================================
hostname HQ-TEST-LAN
ip routing
!
vlan 10
!
vlan 50
!
interface FastEthernet0/10
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
!
interface FastEthernet0/11
 description TO_HQ_GUEST_PC
 switchport access vlan 50
 switchport mode access
 spanning-tree portfast
!
interface GigabitEthernet0/1
 no switchport
 ip address 10.10.0.2 255.255.255.252
!
interface Vlan10
 ip address 10.10.16.1 255.255.240.0
!
interface Vlan50
 description GUEST_GATEWAY
 ip address 10.10.48.1 255.255.248.0
 ip access-group R3_GUEST_IN in
!
ip access-list extended R3_GUEST_IN
 remark ALLOW_GUEST_PING_GATEWAY
 permit icmp 10.10.48.0 0.0.7.255 host 10.10.48.1 echo
 remark DENY_GUEST_TO_INTERNAL_NETWORKS
 deny ip 10.10.48.0 0.0.7.255 10.0.0.0 0.255.255.255
 deny ip 10.10.48.0 0.0.7.255 172.16.0.0 0.15.255.255
 deny ip 10.10.48.0 0.0.7.255 192.168.0.0 0.0.255.255
 remark ALLOW_OTHER_DESTINATIONS
 permit ip 10.10.48.0 0.0.7.255 any
!
ip route 0.0.0.0 0.0.0.0 10.10.0.1
end
