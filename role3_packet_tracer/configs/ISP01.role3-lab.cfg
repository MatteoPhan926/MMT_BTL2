!
! Role 3 - TechViet Innovations - Packet Tracer lab
! ISP01: WAN IPv4 + eBGP underlay + loopback kiem thu NAT/QoS
! File tham khao tu show running-config, khong chua mat khau/serial.
!
version 15.1
hostname ISP01
ip cef
no ipv6 cef
!
interface Loopback99
 description R3_NAT_TEST_DESTINATION
 ip address 203.0.113.10 255.255.255.255
!
interface Loopback100
 description R3_QOS_EF_TEST
 ip address 203.0.113.11 255.255.255.255
!
interface GigabitEthernet0/0
 description TO_HN_EDGE01
 ip address 10.255.1.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO_HQ_EDGE01
 ip address 10.255.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description TO_DN_EDGE01
 ip address 10.255.3.1 255.255.255.252
 no shutdown
!
router bgp 65000
 bgp router-id 10.254.0.21
 bgp log-neighbor-changes
 no synchronization
 neighbor 10.255.2.2 remote-as 65001
 neighbor 10.255.1.2 remote-as 65002
 neighbor 10.255.3.2 remote-as 65003
 network 10.255.1.0 mask 255.255.255.252
 network 10.255.2.0 mask 255.255.255.252
 network 10.255.3.0 mask 255.255.255.252
!
ip classless
end
