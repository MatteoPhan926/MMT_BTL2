
! Transit addressing only; no OSPF and no save
configure terminal
ip routing
ipv6 unicast-routing
vlan 900
 name OSPF_CORE_TRANSIT
exit
interface Port-channel1
 switchport trunk allowed vlan add 900
exit
interface GigabitEthernet0/0
 description STEP5_TO_HQ-EDGE01
 no switchport
 ip address 10.10.0.6 255.255.255.252
 ipv6 address 2001:db8:10:f001::2/64
 no shutdown
exit
interface Vlan900
 description STEP5_TO_HQ-DIST-01
 ip address 10.10.0.10 255.255.255.252
 ipv6 address 2001:db8:10:f002::2/64
 no shutdown
exit
end
