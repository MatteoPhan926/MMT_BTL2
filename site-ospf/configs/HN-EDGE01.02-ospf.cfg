! OSPFv3 IPv4 and IPv6 AF; verify target image syntax before use
! SVI lines advertise only if Step 3-4 SVI is configured and up/up
configure terminal
interface Loopback0
 ip address 10.254.0.15 255.255.255.255
 ipv6 address 2001:db8:fffe::f/128
exit
router ospfv3 20
 router-id 10.254.0.15
 address-family ipv4 unicast
  passive-interface default
  no passive-interface GigabitEthernet0/1
 exit-address-family
 address-family ipv6 unicast
  passive-interface default
  no passive-interface GigabitEthernet0/1
 exit-address-family
exit
interface Loopback0
 ospfv3 20 area 0 ipv4
 ospfv3 20 area 0 ipv6
exit
interface GigabitEthernet0/1
 ospfv3 20 area 0 ipv4
 ospfv3 20 area 0 ipv6
 ospfv3 network point-to-point
 ospfv3 cost 10
exit
end
! No WAN, tunnel, OOB, redistribution or default origination.
